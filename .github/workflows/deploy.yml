name: ShopSphere CI/CD

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — install, build, deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build (Prisma Client generation)
        run: npx prisma generate
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_WGmXHGpnARqfsIw7sELd8tWb
          VERCEL_PROJECT_ID: prj_vn8tzx3qYZEYiCgjaD0OR9yAup6q

  frontend:
    name: Frontend — install, build, deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_WGmXHGpnARqfsIw7sELd8tWb
          VERCEL_PROJECT_ID: prj_3HoYVrWkcZBp1pCvqHxAlADM5NtE

  review-service:
    name: Review service — install, build, deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build (syntax check)
        run: node --check src/app.js
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_WGmXHGpnARqfsIw7sELd8tWb
          VERCEL_PROJECT_ID: prj_vyPWPd2o1L4XWzYuHkedkI5FOG9m